<script type="module">
    import { pipeline, env } from
      "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";

    env.allowRemoteModels = true;
    env.allowLocalModels = false;

    const MODEL_NAME = "onnx-community/Qwen2.5-0.5B-Instruct";

    const chat = document.getElementById("chat");
    const welcome = document.getElementById("welcome");
    const status = document.getElementById("status");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const clearBtn = document.getElementById("clearBtn");
    const typing = document.getElementById("typing");

    let generator = null;
    let messages = [
      {
        role: "system",
        content: "Você é um assistente prestativo, preciso e conciso. Responda sempre em português do Brasil, com base estritamente em fatos."
      }
    ];

    function setStatus(text, type = "") {
      status.textContent = text;
      status.className = type;
    }

    function addMessage(role, text) {
      if (welcome) welcome.style.display = "none";
      const row = document.createElement("div");
      row.className = `message ${role}`;
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      row.appendChild(bubble);
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
      return bubble;
    }

    function onProgress(p) {
      if (p.status === "progress" && typeof p.progress === "number") {
        setStatus("Baixando modelo... " + Math.round(p.progress) + "%");
      }
    }

    // Transformado em função disparada por clique do usuário para burlar restrições de timeout da Vercel
    async function loadModel() {
      const loadBtn = document.getElementById("loadModelBtn");
      if (loadBtn) loadBtn.style.display = "none";

      try {
        setStatus("Iniciando download do modelo (WASM/CPU)... Aguarde.");
        
        generator = await pipeline("text-generation", MODEL_NAME, {
          device: "wasm",
          progress_callback: onProgress
        });

        setStatus("Modelo pronto para uso!", "ready");
        document.getElementById("footnote").textContent = "Modelo: " + MODEL_NAME + " · ativo";
        input.disabled = false;
        sendBtn.disabled = false;
        input.focus();
      } catch (error) {
        console.error(error);
        setStatus("Erro ao carregar: " + (error?.message || error), "error");
        if (loadBtn) loadBtn.style.display = "inline-block";
      }
    }

    // Adicionamos um botão de início na tela de boas-vindas para evitar o bloqueio automático
    if (welcome) {
      const btnContainer = document.createElement("div");
      btnContainer.style.marginTop = "20px";
      btnContainer.innerHTML = `<button id="loadModelBtn" style="padding: 10px 20px; background: #172033; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">Carregar IA no Navegador</button>`;
      welcome.appendChild(btnContainer);
      
      document.getElementById("loadModelBtn").addEventListener("click", loadModel);
    }

    async function generate(userText) {
      messages.push({ role: "user", content: userText });
      typing.style.display = "block";
      sendBtn.disabled = true;
      input.disabled = true;

      try {
        const output = await generator(messages, {
          max_new_tokens: 256,
          repetition_penalty: 1.15,
          temperature: 0.2,
          top_p: 0.8,
          do_sample: true
        });

        const generated = output?.[0]?.generated_text;
        let answer = "";

        if (Array.isArray(generated)) {
          const last = generated[generated.length - 1];
          answer = typeof last === "string" ? last : last?.content || "";
        } else {
          answer = String(generated || "");
        }

        if (Array.isArray(generated) && generated.length > messages.length - 1) {
          const lastMsg = generated[generated.length - 1];
          if (lastMsg && lastMsg.role === 'assistant') {
            answer = lastMsg.content;
          }
        }

        answer = answer.trim() || "Não consegui gerar uma resposta.";
        messages.push({ role: "assistant", content: answer });
        addMessage("assistant", answer);
      } catch (error) {
        console.error(error);
        messages.pop();
        addMessage("assistant", "Ocorreu um erro ao gerar a resposta.");
      } finally {
        typing.style.display = "none";
        sendBtn.disabled = false;
        input.disabled = false;
        input.focus();
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text || !generator) return;
      addMessage("user", text);
      input.value = "";
      input.style.height = "48px";
      await generate(text);
    });

    input.addEventListener("input", () => {
      input.style.height = "48px";
      input.style.height = Math.min(input.scrollHeight, 140) + "px";
    });

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    clearBtn.addEventListener("click", () => {
      messages = [{ role: "system", content: "Você é um assistente prestativo, preciso e conciso." }];
      chat.innerHTML = "";
      chat.appendChild(welcome);
      welcome.style.display = "block";
      input.value = "";
      input.focus();
    });
  </script>
